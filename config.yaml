# greenpro pipeline configuration.
#
# Every value here has a matching field in greenpro/config.py with the same
# default -- this file only needs to list what you're overriding, but it's
# written out in full so it doubles as documentation of every tunable.
#
# Anything here can also be changed live, without restarting, via:
#   curl -X POST http://<host>:8000/config -d '{"geometry": {"rotation": 180}}'

capture:
  source: picam            # "picam" | "image:<path>" | "video:<path>"
  main_size: [648, 486]    # preview + neural-segmenter input resolution
  lores_size: [324, 242]   # motion-segmenter / downscale-source resolution
  fps: 20                  # hard-capped to 30 regardless of this value (see
                            # greenpro/config.py MAX_DISPLAY_FPS and the
                            # pipeline's independent frame pacer)

geometry:
  rotation: 90              # 0 | 90 | 180 | 270 -- camera mounted sideways
  hflip: false
  vflip: false
  fit: crop                 # "crop" | "squash" | "pad"
  crop_anchor: center       # "center" | "start" | "end"
  zoom: 1.0

shading:
  fg_color: [0, 150, 0]     # human figure -- mid-brightness green, not blinding white
  bg_color: [0, 0, 0]       # background
  shading: linear           # "linear" | "threshold" | "gamma"
  gamma: 1.0
  levels: 0                 # 0 = smooth, else quantize to N discrete steps
  min_coverage: 0.0         # coverage below this -> forced to 0 (denoise)
  threshold: 0.5            # used when shading == "threshold"

segmenter:
  # "motion"  -- MOG2 background subtraction. No model needed, but loses
  #              anyone who stops moving within seconds. Kept as a
  #              no-dependencies fallback and for A/B comparison.
  # "neural"  -- generic onnxruntime selfie-segmentation model (needs a
  #              model file at segmenter.neural.model_path -- not vendored,
  #              see docs/models.md; superseded by "topdown" below).
  # "boxfill" -- person detector only, each box filled with a soft ellipse.
  #              Fast path if "topdown" is too slow for a given scene.
  # "topdown" -- (default) person detector -> crop each detection -> run
  #              PP-HumanSeg on the crop. Holds a motionless subject and
  #              works at room scale (3-8m). See docs/models.md for the
  #              measured cost and why this beat every single-model option.
  # "combo"   -- motion ∪ neural (the old "neural" backend, not topdown/boxfill).
  kind: topdown
  combine: max                # combo only: "max" | "min" | "mean" | "motion_gated"
  # "nanodet" (default): true full-body COCO boxes, head-to-feet.
  # "mediapipe": ~2x faster, but its raw box is NOT full-body -- confirmed
  #   live, it tracks as a small square centered on the face/chest and cuts
  #   the body off below. See detectors.py's MediaPipePersonDetector
  #   docstring before switching to it.
  detector_kind: nanodet
  motion:
    history: 300
    var_threshold: 16.0
    learning_rate: -1.0      # -1 = let OpenCV choose automatically
    open_kernel: 3
    close_kernel: 7
    min_blob_area: 40
  neural:
    model_path: models/selfie_segmentation.onnx
    input_size: [256, 256]
    threshold: 0.5
    num_threads: 4
  topdown:
    max_crops: 2              # people beyond this fall back to ellipse fill
    crop_padding: 0.15        # fractional padding around each box before segmenting

# EMA smoothing over the 17x9 coverage grid, applied before shading. At 153
# pixels a single flickering cell is highly visible; alpha=1.0 disables this.
smoothing:
  alpha: 0.6

server:
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70

sink:
  enabled: false            # off by default -- set true (or --send) once
                            # `instance` names a real simulator instance
  base_url: https://sundai.willsarg.com/api
  instance: ""              # e.g. "hazel-toad" -- see docs/simulator.md
  fps: 15                   # hard-capped to 30 regardless of this value,
                            # same MAX_DISPLAY_FPS as capture.fps
  timeout: 2.0               # seconds, per-request
  retry_backoff: 1.0         # seconds, doubles on repeated failures up to 10s
